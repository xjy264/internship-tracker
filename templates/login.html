<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实习投递登录</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}.card{background:white;padding:32px;border-radius:18px;box-shadow:0 12px 40px #1f29371a;width:min(360px,90vw)}input,button{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #d7dce5;font-size:16px}button{margin-top:14px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}h1{margin:0 0 8px}.muted{color:#667085;margin-bottom:24px}
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>实习投递管理</h1>
    <div class="muted">输入访问密码继续</div>
    <input name="password" type="password" placeholder="密码" autofocus required>
    <button type="submit">登录</button>
  </form>
</body>
</html>
